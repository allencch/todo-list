server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # WebSocket push notifications (todo.changed broadcasts). Needs its own
    # location so the connection gets upgraded -- the plain /api/ proxy below
    # doesn't do this and would silently fail to establish the socket.
    location /api/ws {
        proxy_pass http://api:3000/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Matches the frontend's fetch('/api/...') calls -- same relative-path
    # convention the Vite dev server proxy uses.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback so vue-router's client-side routes work on refresh/deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
