# Auto-merged by `docker compose up` on top of docker-compose.yml.
# Switches api/web to their dev toolchain (nodemon/tsx, vite) with source
# mounted for live reload, instead of the production build/runtime.
#
# To run the production config only, bypass this file explicitly:
#   docker compose -f docker-compose.yml up

services:
  api:
    build:
      target: deps
    working_dir: /app/api
    command: pnpm run dev
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - api_node_modules:/app/api/node_modules

  web:
    build:
      target: deps
    working_dir: /app/web
    command: pnpm run dev -- --host 0.0.0.0
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - web_node_modules:/app/web/node_modules
    ports:
      - "5173:5173"

volumes:
  root_node_modules:
  api_node_modules:
  web_node_modules:
